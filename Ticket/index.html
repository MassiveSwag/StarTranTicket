<script>
    // ==========================================
    // EXPIRATION DATE
    // ==========================================

    const today = new Date();

    // Create future expiration date
    const expiryDate = new Date(today);

    // Add 21 days
    expiryDate.setDate(expiryDate.getDate() + 21);

    // Set expiration time to midnight
    expiryDate.setHours(0, 0, 0, 0);


    // Format expiration date
    function formatExpiryDate(date) {

        const options = {
            month: 'short',
            day: 'numeric',
            year: 'numeric'
        };

        const dateString = date.toLocaleDateString(undefined, options);

        return `Expires ${dateString} at 12:00 AM`;
    }


    // ==========================================
    // CLOCK
    // ==========================================

    function updateClockManualAmPm() {

        const now = new Date();

        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        // Determine AM / PM
        const ampm = hours >= 12 ? 'PM' : 'AM';

        // Convert 24-hour time to 12-hour time
        hours = hours % 12;

        // Midnight becomes 12
        hours = hours === 0 ? 12 : hours;

        // Add leading zeros
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        const timeString =
            hours + ':' +
            minutes + ':' +
            seconds + ' ' +
            ampm;

        const clock = document.getElementById("clock");

        if (clock) {
            clock.textContent = timeString;
        }
    }


    // ==========================================
    // CENTRAL TIME
    // ==========================================

    function getCentralTimeISO() {

        return new Intl.DateTimeFormat("en-US", {
            timeZone: "America/Chicago",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }).format(new Date());
    }


    // ==========================================
    // PAGE INITIALIZATION
    // ==========================================

    document.addEventListener("DOMContentLoaded", () => {

        console.log("DOM loaded");

        // Expiration message
        const expiryMessage = document.getElementById("expiryMessage");

        if (expiryMessage) {
            expiryMessage.textContent =
                formatExpiryDate(expiryDate);
        }


        // Initial clock update
        updateClockManualAmPm();

        // Update clock every second
        setInterval(updateClockManualAmPm, 1000);


        // Page content
        const content = document.getElementById("content");

        if (content) {
            // Your code for #content goes here
        }

    });

</script>
